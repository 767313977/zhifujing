name: CI

# 2026-10-11 加。动机：上一轮「前端写死 500、后端上限 250」那类**前后端契约**
# 不一致，双方的检查都发现不了（tsc 过、import 过）。所以这里除了语法/静态检查，
# 还有一条 `scripts/check_api_contract.py` 专门把两边对上。
#
# 三条口径：后端全量语法编译 + pyflakes 那一族静态检查；前端类型检查 + 构建。
# ⚠️ 这个仓库有**两端同时在改**的情况，CI 只跑在推上去的提交上，别指望它替代人工对读。

#
# 2026-10-31 升级 Action 版本（Node20 运行时已从 runner 移除）：
#   actions/checkout v4 → v7、actions/setup-python v5 → v7、actions/setup-node v4 → v7。
# 依据：GitHub changelog「Deprecation of Node 20 on GitHub Actions runners」
# （迁移日期 2026-06-16，2026-09-23 从 runner 移除）与 actions-latest 的版本清单
# （checkout/setup-python/setup-node 均为 v7）。Python 3.13 / Node 22 的版本号不动，
# 只换运行 Action 的运行时。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest
      - name: 全量语法编译
        run: python -m compileall -q backend scripts
      - name: 静态检查（pyflakes 那一族，配置见 ruff.toml）
        run: ruff check backend scripts tests
      - name: 前后端接口参数一致性
        run: python scripts/check_api_contract.py
      - name: 单元测试（配额判档 / 收益口径 / 覆盖率闸）
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 装依赖
        working-directory: frontend
        run: npm ci
      - name: 类型检查 + 构建
        working-directory: frontend
        run: npm run build
